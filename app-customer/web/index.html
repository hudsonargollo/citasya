<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="CitasYa - Reserva de citas y servicios profesionales en Bolivia">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CitasYa">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=9"/>
  <title>CitasYa | Reserva de Citas y Servicios</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Maps JavaScript API for Flutter Web (non-blocking) -->
  <script src="https://maps.googleapis.com/maps/api/js?key=«redacted:AIza…»" async defer></script>

  <!-- Self-contained Ultra-Fast 0ms Intro & Logo Formation Styles -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Full-screen Loading Overlay */
    #citasya-loader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #064E3B 0%, #0F172A 70%, #020617 100%);
      overflow: hidden;
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #citasya-loader.fade-out {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
    }

    /* Ambient Background Glows */
    .ambient-glow {
      position: absolute;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(132, 204, 22, 0.3) 0%, rgba(5, 150, 105, 0.18) 45%, transparent 70%);
      filter: blur(40px);
      animation: ambientPulse 3.5s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes ambientPulse {
      0% { transform: scale(0.85); opacity: 0.6; }
      100% { transform: scale(1.25); opacity: 1; }
    }

    /* Floating Particles (Pure CSS) */
    .particle {
      position: absolute;
      border-radius: 50%;
      background: #84CC16;
      opacity: 0.35;
      filter: blur(1px);
      animation: floatParticle 6s infinite ease-in-out;
    }
    .p1 { width: 6px; height: 6px; top: 22%; left: 22%; animation-duration: 5s; animation-delay: 0s; }
    .p2 { width: 8px; height: 8px; top: 68%; left: 78%; animation-duration: 7s; animation-delay: 1s; background: #059669; }
    .p3 { width: 5px; height: 5px; top: 76%; left: 24%; animation-duration: 6s; animation-delay: 2s; }
    .p4 { width: 7px; height: 7px; top: 18%; left: 76%; animation-duration: 8s; animation-delay: 0.5s; background: #A3E635; }
    .p5 { width: 4px; height: 4px; top: 42%; left: 84%; animation-duration: 5.5s; animation-delay: 1.5s; }

    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) scale(1); opacity: 0.2; }
      50% { transform: translateY(-26px) scale(1.35); opacity: 0.7; }
    }

    /* Center Stage Container */
    .loader-stage {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      max-width: 400px;
    }

    /* 3D Icon & Pulsing Ring Wrapper */
    .icon-box {
      position: relative;
      width: 126px;
      height: 126px;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 800px;
    }

    /* Enveloping Pulsing SVG Ring */
    .svg-ring {
      position: absolute;
      inset: 0;
      width: 126px;
      height: 126px;
      z-index: 3;
      pointer-events: none;
      transform-origin: center center;
    }

    .ring-track {
      stroke: rgba(132, 204, 22, 0.18);
      stroke-width: 3;
      fill: none;
    }

    .ring-pulse-stroke {
      fill: none;
      stroke: url(#limeGradCustomer);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 140 280;
      animation: ringOrbit 2.4s linear infinite, ringAura 2s ease-in-out infinite alternate;
      transform-origin: center center;
    }

    @keyframes ringOrbit {
      0% { stroke-dashoffset: 420; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes ringAura {
      0% {
        transform: scale(0.97);
        opacity: 0.75;
        filter: drop-shadow(0 0 8px rgba(132, 204, 22, 0.7));
      }
      100% {
        transform: scale(1.03);
        opacity: 1;
        filter: drop-shadow(0 0 16px rgba(163, 230, 53, 0.95));
      }
    }

    /* 3D Master Icon Image */
    .app-icon-img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      border-radius: 24px;
      filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.55));
      animation: floatBadge 3s ease-in-out infinite alternate;
      z-index: 2;
    }

    @keyframes floatBadge {
      0% { transform: translateY(0) scale(0.98); }
      100% { transform: translateY(-4px) scale(1.02); }
    }

    /* Brand Typography */
    .brand-name {
      font-size: 28px;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: -0.03em;
      margin-bottom: 4px;
    }

    .brand-name span.lime {
      color: #84CC16;
      text-shadow: 0 0 20px rgba(132, 204, 22, 0.6);
    }

    .brand-sub {
      font-size: 11px;
      font-weight: 700;
      color: #94A3B8;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    /* Ultra-smooth Progress Track */
    .progress-track {
      width: 180px;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 10px;
    }

    .progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 30%;
      background: linear-gradient(90deg, #059669 0%, #84CC16 100%);
      box-shadow: 0 0 10px rgba(132, 204, 22, 0.8);
      border-radius: 9999px;
      animation: autoFill 3s cubic-bezier(0.1, 0.7, 0.1, 1) infinite;
    }

    @keyframes autoFill {
      0% { width: 15%; }
      50% { width: 75%; }
      100% { width: 95%; }
    }

    .status-msg {
      font-size: 11px;
      font-weight: 600;
      color: #64748B;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

  <!-- Instant Animated Intro Overlay -->
  <div id="citasya-loader">
    <div class="ambient-glow"></div>
    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>

    <div class="loader-stage">
      <div class="icon-box">
        <!-- Enveloping Pulsing SVG Ring -->
        <svg class="svg-ring" viewBox="0 0 126 126">
          <defs>
            <linearGradient id="limeGradCustomer" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#A3E635" />
              <stop offset="50%" stop-color="#84CC16" />
              <stop offset="100%" stop-color="#059669" />
            </linearGradient>
          </defs>
          <rect class="ring-track" x="7" y="7" width="112" height="112" rx="28" ry="28" />
          <rect class="ring-pulse-stroke" x="7" y="7" width="112" height="112" rx="28" ry="28" />
        </svg>

        <!-- Crisp 3D Master Badge Icon -->
        <img src="favicon.png?v=9" alt="CitasYa" class="app-icon-img" id="app-icon">
      </div>

      <div class="brand-name">
        Citas<span class="lime">Ya</span>
      </div>
      <div class="brand-sub">Bolivia · Citas & Servicios</div>

      <div class="progress-track">
        <div class="progress-fill" id="progress-bar"></div>
      </div>
      <div class="status-msg" id="status-msg">Sincronizando servicios y negocios...</div>
    </div>
  </div>

  <!-- Synchronized Seamless Dismissal Engine Hook -->
  <script>
    (function() {
      let isDismissed = false;
      window.dismissLoader = function() {
        if (isDismissed) return;
        isDismissed = true;
        const loader = document.getElementById('citasya-loader');
        const pBar = document.getElementById('progress-bar');
        const sMsg = document.getElementById('status-msg');
        if (pBar) {
          pBar.style.animation = 'none';
          pBar.style.width = '100%';
        }
        if (sMsg) sMsg.innerText = '¡Todo listo!';
        
        // Wait 150ms so the initial Flutter frame buffer is fully drawn to the display
        setTimeout(function() {
          if (loader) {
            loader.classList.add('fade-out');
            setTimeout(function() {
              loader.remove();
            }, 550);
          }
        }, 150);
      };

      // 1. Primary Trigger: Wait for Flutter's full data & asset load
      window.addEventListener('citasya-app-fully-loaded', function() {
        window.dismissLoader();
      });

      // 2. Secondary Trigger: Fallback after first frame
      window.addEventListener('flutter-first-frame', function() {
        setTimeout(window.dismissLoader, 800);
      });

      // 3. Failsafe timeout: Max 8s
      setTimeout(window.dismissLoader, 8000);
    })();
  </script>

  <!-- Flutter Web Bootstrap -->
  <script src="flutter_bootstrap.js?v=20260924v8" async></script>
</body>
</html>
