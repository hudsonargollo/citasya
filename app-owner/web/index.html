<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="CitasYa Negocios - Gestión inteligente de citas y profesionales en Bolivia">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CitasYa Negocios">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=8"/>
  <title>CitasYa Negocios | Panel Pro</title>
  <link rel="manifest" href="manifest.json">

  <!-- Self-contained Ultra-Fast 0ms Intro & Logo Formation Styles -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Full-screen Loading Overlay */
    #citasya-loader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #064E3B 0%, #0F172A 70%, #020617 100%);
      overflow: hidden;
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #citasya-loader.fade-out {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
    }

    /* Ambient Background Glows */
    .ambient-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(132, 204, 22, 0.25) 0%, rgba(5, 150, 105, 0.15) 45%, transparent 70%);
      filter: blur(40px);
      animation: ambientPulse 4s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes ambientPulse {
      0% { transform: scale(0.85) translate(0, 0); opacity: 0.6; }
      100% { transform: scale(1.2) translate(10px, -10px); opacity: 0.9; }
    }

    /* Floating Particles (Pure CSS) */
    .particle {
      position: absolute;
      border-radius: 50%;
      background: #84CC16;
      opacity: 0.3;
      filter: blur(1px);
      animation: floatParticle 6s infinite ease-in-out;
    }
    .p1 { width: 6px; height: 6px; top: 25%; left: 20%; animation-duration: 5s; animation-delay: 0s; }
    .p2 { width: 8px; height: 8px; top: 65%; left: 80%; animation-duration: 7s; animation-delay: 1s; background: #059669; }
    .p3 { width: 5px; height: 5px; top: 75%; left: 25%; animation-duration: 6s; animation-delay: 2s; }
    .p4 { width: 7px; height: 7px; top: 20%; left: 75%; animation-duration: 8s; animation-delay: 0.5s; background: #A3E635; }
    .p5 { width: 4px; height: 4px; top: 40%; left: 85%; animation-duration: 5.5s; animation-delay: 1.5s; }

    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) scale(1); opacity: 0.2; }
      50% { transform: translateY(-30px) scale(1.3); opacity: 0.6; }
    }

    /* Center Stage Container */
    .loader-stage {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      max-width: 400px;
    }

    /* 3D Icon & SVG Forming Wrapper */
    .icon-box {
      position: relative;
      width: 110px;
      height: 110px;
      margin-bottom: 22px;
      perspective: 800px;
    }

    /* Animated SVG Forming Lines */
    .svg-forming {
      position: absolute;
      inset: -5px;
      width: 120px;
      height: 120px;
      z-index: 3;
      pointer-events: none;
    }

    .svg-forming path, .svg-forming rect {
      fill: none;
      stroke: #84CC16;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 320;
      stroke-dashoffset: 320;
      animation: drawCalendar 1.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      filter: drop-shadow(0 0 8px rgba(132, 204, 22, 0.7));
    }

    .svg-forming .check-mark {
      stroke: #A3E635;
      stroke-width: 4.5;
      stroke-dasharray: 80;
      stroke-dashoffset: 80;
      animation: drawCheck 1.2s cubic-bezier(0.4, 0, 0.2, 1) 0.5s forwards;
    }

    @keyframes drawCalendar {
      0% { stroke-dashoffset: 320; opacity: 0.2; }
      40% { stroke-dashoffset: 0; opacity: 1; }
      85% { opacity: 0.9; }
      100% { opacity: 0; }
    }

    @keyframes drawCheck {
      0% { stroke-dashoffset: 80; opacity: 0; }
      50% { stroke-dashoffset: 0; opacity: 1; }
      85% { opacity: 0.9; }
      100% { opacity: 0; }
    }

    /* 3D Master Owner Icon Image */
    .app-icon-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 26px;
      filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.5));
      opacity: 0;
      transform: scale(0.7) translateY(14px) rotateX(15deg);
      animation: revealIcon 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }

    @keyframes revealIcon {
      0% {
        opacity: 0;
        transform: scale(0.7) translateY(14px) rotateX(15deg);
      }
      60% {
        opacity: 1;
        transform: scale(1.06) translateY(-2px) rotateX(-4deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0) rotateX(0deg);
      }
    }

    /* Brand Typography */
    .brand-name {
      font-size: 28px;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: -0.03em;
      margin-bottom: 4px;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .brand-name span.lime {
      color: #84CC16;
      text-shadow: 0 0 20px rgba(132, 204, 22, 0.6);
    }

    .owner-badge {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      background: rgba(132, 204, 22, 0.18);
      color: #A3E635;
      border: 1px solid rgba(132, 204, 22, 0.4);
      padding: 2px 7px;
      border-radius: 9999px;
    }

    .brand-sub {
      font-size: 11px;
      font-weight: 700;
      color: #94A3B8;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 22px;
      opacity: 0;
      transform: translateY(8px);
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Ultra-smooth Progress Track */
    .progress-track {
      width: 180px;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 10px;
      opacity: 0;
      animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
    }

    .progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 25%;
      background: linear-gradient(90deg, #059669 0%, #84CC16 100%);
      box-shadow: 0 0 10px rgba(132, 204, 22, 0.8);
      border-radius: 9999px;
      animation: autoFill 2.4s cubic-bezier(0.1, 0.7, 0.1, 1) forwards;
    }

    @keyframes autoFill {
      0% { width: 15%; }
      40% { width: 60%; }
      80% { width: 88%; }
      100% { width: 98%; }
    }

    .status-msg {
      font-size: 11px;
      font-weight: 600;
      color: #64748B;
      letter-spacing: 0.02em;
      opacity: 0;
      animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards;
    }
  </style>
</head>
<body>

  <!-- Instant Animated Intro Overlay -->
  <div id="citasya-loader">
    <div class="ambient-glow"></div>
    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>

    <div class="loader-stage">
      <div class="icon-box">
        <!-- SVG Forming Stroke Animation -->
        <svg class="svg-forming" viewBox="0 0 100 100">
          <rect x="12" y="18" width="76" height="68" rx="20" />
          <path d="M30 12 L30 24 M70 12 L70 24" />
          <path class="check-mark" d="M36 54 L46 64 L66 42" />
        </svg>

        <!-- Crisp 3D Master Owner Icon -->
        <img src="favicon.png?v=8" alt="CitasYa Negocios" class="app-icon-img" id="app-icon">
      </div>

      <div class="brand-name">
        <span>Citas<span class="lime">Ya</span></span>
        <span class="owner-badge">PRO</span>
      </div>
      <div class="brand-sub">Panel de Negocios · Bolivia</div>

      <div class="progress-track">
        <div class="progress-fill" id="progress-bar"></div>
      </div>
      <div class="status-msg" id="status-msg">Iniciando panel de gestión...</div>
    </div>
  </div>

  <!-- Immediate Fast Dismissal Engine Hook -->
  <script>
    (function() {
      let isDismissed = false;
      window.dismissLoader = function() {
        if (isDismissed) return;
        isDismissed = true;
        const loader = document.getElementById('citasya-loader');
        const pBar = document.getElementById('progress-bar');
        const sMsg = document.getElementById('status-msg');
        if (pBar) pBar.style.width = '100%';
        if (sMsg) sMsg.innerText = '¡Listo!';
        
        setTimeout(function() {
          if (loader) {
            loader.classList.add('fade-out');
            setTimeout(function() {
              loader.remove();
            }, 550);
          }
        }, 150);
      };

      // Failsafe timeout: Never let the loader block user past 3.5s
      setTimeout(window.dismissLoader, 3500);

      // Dismiss as soon as Flutter renders any flutter-view or canvas
      const observer = new MutationObserver(function(mutations) {
        if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane') || document.querySelector('flt-scene-host')) {
          observer.disconnect();
          window.dismissLoader();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    })();
  </script>

  <!-- Flutter Web Bootstrap -->
  <script src="flutter_bootstrap.js?v=20260924v5" async></script>
</body>
</html>
