<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="CitasYa Negocios - Gestión inteligente de citas y profesionales en Bolivia">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CitasYa Negocios">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=11"/>
  <title>CitasYa Negocios | Panel Pro</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Maps JavaScript API for Flutter Web (non-blocking) -->
  <script src="https://maps.googleapis.com/maps/api/js?key=«redacted:AIza…»" async defer></script>

  <!-- Tektone-inspired 3D Perspective Zoom-In Loading Scene -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020617;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Full-screen 3D Perspective Stage */
    #citasya-loader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #064E3B 0%, #0F172A 65%, #020617 100%);
      perspective: 1200px;
      overflow: hidden;
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #citasya-loader.fade-out {
      opacity: 0;
      transform: scale(1.08);
      pointer-events: none;
    }

    /* Immersive 3D Space Container */
    .space-3d {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
    }

    /* Ambient Depth Glow */
    .ambient-glow {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(132, 204, 22, 0.35) 0%, rgba(5, 150, 105, 0.2) 50%, transparent 75%);
      filter: blur(50px);
      transform: translateZ(-300px);
      animation: ambientPulse 4s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes ambientPulse {
      0% { transform: translateZ(-300px) scale(0.8); opacity: 0.5; }
      100% { transform: translateZ(-100px) scale(1.2); opacity: 0.9; }
    }

    /* Floating 3D Starfield / Particles */
    .particle {
      position: absolute;
      border-radius: 50%;
      background: #84CC16;
      opacity: 0.4;
      filter: blur(1px);
      animation: floatDepth 5s infinite ease-in-out;
    }
    .p1 { width: 5px; height: 5px; top: 30%; left: 25%; transform: translateZ(-200px); animation-delay: 0s; }
    .p2 { width: 7px; height: 7px; top: 70%; left: 75%; transform: translateZ(-400px); animation-delay: 1s; background: #059669; }
    .p3 { width: 4px; height: 4px; top: 80%; left: 30%; transform: translateZ(-150px); animation-delay: 2s; }
    .p4 { width: 6px; height: 6px; top: 20%; left: 70%; transform: translateZ(-350px); animation-delay: 0.5s; background: #A3E635; }

    @keyframes floatDepth {
      0%, 100% { transform: translateZ(-200px) translateY(0px); opacity: 0.2; }
      50% { transform: translateZ(100px) translateY(-35px); opacity: 0.8; }
    }

    /* 3D Perspective Logo Box (Tektone-inspired zoom in from deep space) */
    .logo-3d-box {
      position: relative;
      width: 140px;
      height: 140px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      animation: zoomInPerspective 1.6s cubic-bezier(0.15, 0.85, 0.35, 1) forwards;
    }

    @keyframes zoomInPerspective {
      0% {
        transform: translateZ(-900px) scale(0.15) rotateX(35deg) rotateY(-25deg);
        opacity: 0;
      }
      60% {
        opacity: 1;
      }
      100% {
        transform: translateZ(0px) scale(1) rotateX(0deg) rotateY(0deg);
        opacity: 1;
      }
    }

    /* Enveloping Pulsing Neon SVG Ring */
    .svg-ring {
      position: absolute;
      inset: -10px;
      width: 160px;
      height: 160px;
      z-index: 3;
      pointer-events: none;
      transform-style: preserve-3d;
    }

    .ring-track {
      stroke: rgba(132, 204, 22, 0.2);
      stroke-width: 3;
      fill: none;
    }

    .ring-pulse-stroke {
      fill: none;
      stroke: url(#limeGradOwner);
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 180 360;
      animation: ringOrbit 2.2s linear infinite, ringAura 1.8s ease-in-out infinite alternate;
      transform-origin: center center;
    }

    @keyframes ringOrbit {
      0% { stroke-dashoffset: 540; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes ringAura {
      0% {
        transform: scale(0.96);
        opacity: 0.7;
        filter: drop-shadow(0 0 10px rgba(132, 204, 22, 0.7));
      }
      100% {
        transform: scale(1.04);
        opacity: 1;
        filter: drop-shadow(0 0 22px rgba(163, 230, 53, 0.95));
      }
    }

    /* 3D Master Badge Icon */
    .app-icon-img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      border-radius: 30px;
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.7));
      transform-style: preserve-3d;
      z-index: 2;
    }

    /* Brand Typography (Zooms in with perspective) */
    .brand-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transform-style: preserve-3d;
      animation: zoomInText 1.5s cubic-bezier(0.15, 0.85, 0.35, 1) 0.2s forwards;
      opacity: 0;
    }

    @keyframes zoomInText {
      0% {
        transform: translateZ(-500px) translateY(30px);
        opacity: 0;
      }
      100% {
        transform: translateZ(0px) translateY(0px);
        opacity: 1;
      }
    }

    .brand-name {
      font-size: 32px;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: -0.03em;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .brand-name span.lime {
      color: #84CC16;
      text-shadow: 0 0 25px rgba(132, 204, 22, 0.7);
    }

    .owner-badge {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      background: rgba(132, 204, 22, 0.2);
      color: #A3E635;
      border: 1px solid rgba(132, 204, 22, 0.45);
      padding: 3px 8px;
      border-radius: 9999px;
    }

    .brand-sub {
      font-size: 11px;
      font-weight: 700;
      color: #94A3B8;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    /* Sleek Loading Bar */
    .progress-track {
      width: 160px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #059669 0%, #84CC16 100%);
      box-shadow: 0 0 12px rgba(132, 204, 22, 0.9);
      border-radius: 9999px;
      animation: fillBar 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fillBar {
      0% { width: 10%; }
      70% { width: 85%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>

  <!-- Tektone-inspired 3D Perspective Loading Scene -->
  <div id="citasya-loader">
    <div class="space-3d">
      <div class="ambient-glow"></div>
      <div class="particle p1"></div>
      <div class="particle p2"></div>
      <div class="particle p3"></div>
      <div class="particle p4"></div>

      <div class="logo-3d-box">
        <!-- Neon Pulsing Enveloping SVG Ring -->
        <svg class="svg-ring" viewBox="0 0 160 160">
          <defs>
            <linearGradient id="limeGradOwner" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#A3E635" />
              <stop offset="50%" stop-color="#84CC16" />
              <stop offset="100%" stop-color="#059669" />
            </linearGradient>
          </defs>
          <rect class="ring-track" x="10" y="10" width="140" height="140" rx="36" ry="36" />
          <rect class="ring-pulse-stroke" x="10" y="10" width="140" height="140" rx="36" ry="36" />
        </svg>

        <!-- 3D Master Logo Badge -->
        <img src="favicon.png?v=11" alt="CitasYa Negocios" class="app-icon-img" id="app-icon">
      </div>

      <div class="brand-content">
        <div class="brand-name">
          <span>Citas<span class="lime">Ya</span></span>
          <span class="owner-badge">PRO</span>
        </div>
        <div class="brand-sub">Panel de Negocios · Bolivia</div>

        <div class="progress-track">
          <div class="progress-fill" id="progress-bar"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bulletproof Fast Dismissal Hook (1.7s max) -->
  <script>
    (function() {
      let isDismissed = false;
      window.dismissLoader = function() {
        if (isDismissed) return;
        isDismissed = true;
        const loader = document.getElementById('citasya-loader');
        setTimeout(function() {
          if (loader) {
            loader.classList.add('fade-out');
            setTimeout(function() {
              loader.remove();
            }, 450);
          }
        }, 100);
      };

      // Guaranteed fast dismissal timer (1.7 seconds)
      setTimeout(window.dismissLoader, 1700);
      window.addEventListener('flutter-first-frame', window.dismissLoader);
    })();
  </script>

  <!-- Flutter Web Bootstrap -->
  <script src="flutter_bootstrap.js?v=20260924v12" async></script>
</body>
</html>
