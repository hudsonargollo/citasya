<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="CitasYa Negocios - Gestión inteligente de citas y profesionales en Bolivia">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CitasYa Negocios">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=7"/>
  <title>CitasYa Negocios | Panel Pro</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts for sleek typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">

  <!-- Three.js for 3D animated particles & crystal mesh -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0F172A;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #citasya-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #064E3B 0%, #0F172A 75%, #020617 100%);
      overflow: hidden;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #citasya-loader.fade-out {
      opacity: 0;
      transform: scale(1.05);
      pointer-events: none;
    }

    #three-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .loader-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      max-width: 420px;
      width: 90%;
    }

    /* 3D Icon Container with Floating Glow */
    .icon-stage {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      perspective: 800px;
    }

    .icon-glow-backdrop {
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(132, 204, 22, 0.45) 0%, rgba(5, 150, 105, 0.2) 50%, transparent 70%);
      filter: blur(20px);
      animation: pulseGlow 3s ease-in-out infinite alternate;
      z-index: -1;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.85); opacity: 0.6; }
      100% { transform: scale(1.25); opacity: 1; }
    }

    .svg-forming-logo {
      position: absolute;
      width: 128px;
      height: 128px;
      z-index: 2;
      pointer-events: none;
    }

    .forming-path {
      fill: none;
      stroke: #84CC16;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: drawStroke 2.2s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      filter: drop-shadow(0 0 8px rgba(132, 204, 22, 0.8));
    }

    @keyframes drawStroke {
      0% { stroke-dashoffset: 400; opacity: 0; }
      30% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }

    .app-icon-3d {
      width: 104px;
      height: 104px;
      object-fit: contain;
      border-radius: 26px;
      filter: drop-shadow(0 14px 30px rgba(0, 0, 0, 0.5));
      opacity: 0;
      transform: scale(0.65) rotateY(-20deg);
      animation: revealIcon 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
      transition: transform 0.15s ease-out;
    }

    @keyframes revealIcon {
      0% {
        opacity: 0;
        transform: scale(0.65) rotateY(-20deg) translateY(20px);
      }
      60% {
        opacity: 1;
        transform: scale(1.08) rotateY(5deg) translateY(-4px);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotateY(0deg) translateY(0);
      }
    }

    /* Brand Typography */
    .brand-title {
      font-size: 28px;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: -0.03em;
      margin-bottom: 4px;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .brand-title .lime-highlight {
      color: #84CC16;
      text-shadow: 0 0 20px rgba(132, 204, 22, 0.6);
    }

    .owner-badge {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      background: rgba(132, 204, 22, 0.15);
      color: #A3E635;
      border: 1px solid rgba(132, 204, 22, 0.35);
      padding: 3px 8px;
      border-radius: 9999px;
      margin-left: 6px;
    }

    .brand-tagline {
      font-size: 12px;
      font-weight: 600;
      color: #94A3B8;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 24px;
      opacity: 0;
      transform: translateY(8px);
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Progress Bar & Loader Indicator */
    .progress-container {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 12px;
      opacity: 0;
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1s forwards;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #059669 0%, #84CC16 100%);
      box-shadow: 0 0 12px rgba(132, 204, 22, 0.8);
      border-radius: 9999px;
      transition: width 0.3s ease-out;
    }

    .status-text {
      font-size: 11px;
      font-weight: 600;
      color: #64748B;
      letter-spacing: 0.02em;
      min-height: 18px;
      opacity: 0;
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.1s forwards;
    }
  </style>
</head>
<body>

  <!-- Animated Intro Loading Overlay -->
  <div id="citasya-loader">
    <canvas id="three-canvas"></canvas>
    
    <div class="loader-content">
      <div class="icon-stage" id="icon-stage">
        <div class="icon-glow-backdrop"></div>
        
        <!-- SVG Stroke Forming Line Animation -->
        <svg class="svg-forming-logo" viewBox="0 0 100 100">
          <rect class="forming-path" x="12" y="18" width="76" height="68" rx="20" />
          <path class="forming-path" d="M30 12 L30 24 M70 12 L70 24" />
          <path class="forming-path" d="M36 54 L46 64 L66 42" stroke-width="4" />
        </svg>

        <!-- 3D Master Owner Icon Badge -->
        <img src="favicon.png?v=7" alt="CitasYa Negocios" class="app-icon-3d" id="app-icon">
      </div>

      <div class="brand-title">
        <span>Citas</span><span class="lime-highlight">Ya</span>
        <span class="owner-badge">PRO</span>
      </div>
      <div class="brand-tagline">Panel de Negocios · Bolivia</div>

      <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="status-text" id="status-text">Iniciando panel de gestión...</div>
    </div>
  </div>

  <!-- Three.js Ambient Particle Scene -->
  <script>
    (function initThreeBackground() {
      const canvas = document.getElementById('three-canvas');
      if (!window.THREE || !canvas) return;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 35;

      const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      // 1. Particle Cloud
      const particleCount = 140;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);

      const colorEmerald = new THREE.Color(0x006948);
      const colorLime = new THREE.Color(0x84CC16);
      const colorCyan = new THREE.Color(0x059669);

      for (let i = 0; i < particleCount; i++) {
        positions[i * 3] = (Math.random() - 0.5) * 60;
        positions[i * 3 + 1] = (Math.random() - 0.5) * 60;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 40;

        const pColor = Math.random() > 0.5 ? colorLime : (Math.random() > 0.5 ? colorEmerald : colorCyan);
        colors[i * 3] = pColor.r;
        colors[i * 3 + 1] = pColor.g;
        colors[i * 3 + 2] = pColor.b;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 1.4,
        vertexColors: true,
        transparent: true,
        opacity: 0.75,
        blending: THREE.AdditiveBlending
      });

      const particleSystem = new THREE.Points(geometry, material);
      scene.add(particleSystem);

      // 2. Geometric Floating Ring/Icosahedron Wireframe
      const ringGeo = new THREE.IcosahedronGeometry(14, 1);
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0x84CC16,
        wireframe: true,
        transparent: true,
        opacity: 0.15
      });
      const ringMesh = new THREE.Mesh(ringGeo, ringMat);
      scene.add(ringMesh);

      // Mouse Parallax
      let mouseX = 0, mouseY = 0;
      window.addEventListener('mousemove', (e) => {
        mouseX = (e.clientX - window.innerWidth / 2) * 0.0008;
        mouseY = (e.clientY - window.innerHeight / 2) * 0.0008;
      });

      // Render Loop
      let animId;
      function animate() {
        animId = requestAnimationFrame(animate);
        particleSystem.rotation.y += 0.0018;
        particleSystem.rotation.x += 0.0008;
        ringMesh.rotation.x += 0.003;
        ringMesh.rotation.y += 0.004;

        camera.position.x += (mouseX * 20 - camera.position.x) * 0.05;
        camera.position.y += (-mouseY * 20 - camera.position.y) * 0.05;
        camera.lookAt(scene.position);

        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      window.__stopThreeLoader = function() {
        cancelAnimationFrame(animId);
        renderer.dispose();
      };
    })();
  </script>

  <!-- Concurrent Asset Preloading & Progress Tracking -->
  <script>
    (function initPreloader() {
      const progressBar = document.getElementById('progress-bar');
      const statusText = document.getElementById('status-text');
      const appIcon = document.getElementById('app-icon');
      const iconStage = document.getElementById('icon-stage');

      let currentProgress = 10;
      function updateProgress(target, text) {
        currentProgress = Math.max(currentProgress, target);
        if (progressBar) progressBar.style.width = currentProgress + '%';
        if (statusText && text) statusText.innerText = text;
      }

      updateProgress(25, 'Sincronizando agenda y reservas...');

      // 3D Mouse Tilt on Icon
      if (iconStage && appIcon) {
        window.addEventListener('mousemove', (e) => {
          const rect = iconStage.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          const dx = (e.clientX - cx) / (window.innerWidth / 2);
          const dy = (e.clientY - cy) / (window.innerHeight / 2);
          appIcon.style.transform = `scale(1) rotateY(${dx * 18}deg) rotateX(${-dy * 18}deg)`;
        });
      }

      // Preload critical assets in background
      const assetsToPreload = [
        'https://citasya.clubemkt.online/api/settings',
        'https://citasya.clubemkt.online/images/brand/icon_owner.png',
        'https://citasya.clubemkt.online/images/categories/1_barberia.png',
        'https://citasya.clubemkt.online/images/categories/2_unas.png',
        'https://citasya.clubemkt.online/images/categories/3_facial.png'
      ];

      let loadedCount = 0;
      assetsToPreload.forEach(url => {
        fetch(url, { mode: 'cors' }).catch(() => {}).finally(() => {
          loadedCount++;
          const p = 30 + Math.floor((loadedCount / assetsToPreload.length) * 35);
          updateProgress(p, 'Cargando servicios y sucursales...');
        });
      });

      // Global dismissal called by Flutter bootstrap
      window.hideLoadingIntro = function() {
        updateProgress(100, '¡Todo listo!');
        setTimeout(() => {
          const loader = document.getElementById('citasya-loader');
          if (loader) {
            loader.classList.add('fade-out');
            setTimeout(() => {
              if (window.__stopThreeLoader) window.__stopThreeLoader();
              loader.remove();
            }, 650);
          }
        }, 300);
      };
    })();
  </script>

  <!-- Flutter Web Bootstrapper -->
  <script src="flutter.js?v=20260924v3" defer></script>
  <script>
    window.addEventListener('load', function() {
      if (window._flutter && window._flutter.loader) {
        _flutter.loader.loadEntrypoint({
          serviceWorker: {
            serviceWorkerVersion: "$FLUTTER_SERVICE_WORKER_VERSION"
          },
          onEntrypointLoaded: async function(engineInitializer) {
            if (document.getElementById('status-text')) {
              document.getElementById('status-text').innerText = 'Iniciando motor gráfico...';
              document.getElementById('progress-bar').style.width = '85%';
            }
            const appRunner = await engineInitializer.initializeEngine();
            if (window.hideLoadingIntro) {
              window.hideLoadingIntro();
            }
            await appRunner.runApp();
          }
        });
      }
    });
  </script>
</body>
</html>
