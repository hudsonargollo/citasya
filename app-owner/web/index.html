  <!-- Tektone Temple-inspired 3D Perspective Zoom-In & Zoom-Out Exit Styles -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020617;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Full-screen 3D Perspective Stage */
    #citasya-loader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #064E3B 0%, #0F172A 65%, #020617 100%);
      perspective: 1400px;
      overflow: hidden;
      transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1), transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), filter 0.6s ease-out;
    }

    /* Tektone Temple Scene Zoom-Out / Push-Forward Exit Animation */
    #citasya-loader.fade-out {
      opacity: 0;
      transform: scale(2.6) translateZ(500px);
      filter: blur(16px);
      pointer-events: none;
    }

    /* Immersive 3D Space Container */
    .space-3d {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
    }

    /* Ambient Depth Glow */
    .ambient-glow {
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(132, 204, 22, 0.4) 0%, rgba(5, 150, 105, 0.22) 50%, transparent 75%);
      filter: blur(60px);
      transform: translateZ(-350px);
      animation: ambientPulse 4s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes ambientPulse {
      0% { transform: translateZ(-350px) scale(0.8); opacity: 0.5; }
      100% { transform: translateZ(-120px) scale(1.25); opacity: 0.95; }
    }

    /* Floating 3D Particles */
    .particle {
      position: absolute;
      border-radius: 50%;
      background: #84CC16;
      opacity: 0.45;
      filter: blur(1px);
      animation: floatDepth 5s infinite ease-in-out;
    }
    .p1 { width: 6px; height: 6px; top: 25%; left: 20%; transform: translateZ(-200px); animation-delay: 0s; }
    .p2 { width: 8px; height: 8px; top: 72%; left: 80%; transform: translateZ(-450px); animation-delay: 1s; background: #059669; }
    .p3 { width: 5px; height: 5px; top: 80%; left: 25%; transform: translateZ(-150px); animation-delay: 2s; }
    .p4 { width: 7px; height: 7px; top: 18%; left: 75%; transform: translateZ(-380px); animation-delay: 0.5s; background: #A3E635; }

    @keyframes floatDepth {
      0%, 100% { transform: translateZ(-200px) translateY(0px); opacity: 0.2; }
      50% { transform: translateZ(120px) translateY(-40px); opacity: 0.85; }
    }

    /* 3D Perspective Logo Box */
    .logo-3d-box {
      position: relative;
      width: 150px;
      height: 150px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      animation: zoomInPerspective 1.6s cubic-bezier(0.15, 0.85, 0.35, 1) forwards;
    }

    @keyframes zoomInPerspective {
      0% {
        transform: translateZ(-1000px) scale(0.1) rotateX(40deg) rotateY(-30deg);
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: translateZ(0px) scale(1) rotateX(0deg) rotateY(0deg);
        opacity: 1;
      }
    }

    /* Enveloping Pulsing Neon SVG Ring */
    .svg-ring {
      position: absolute;
      inset: -12px;
      width: 174px;
      height: 174px;
      z-index: 3;
      pointer-events: none;
      transform-style: preserve-3d;
    }

    .ring-track {
      stroke: rgba(132, 204, 22, 0.22);
      stroke-width: 3.5;
      fill: none;
    }

    .ring-pulse-stroke {
      fill: none;
      stroke: url(#limeGradOwner);
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 200 400;
      animation: ringOrbit 2.2s linear infinite, ringAura 1.8s ease-in-out infinite alternate;
      transform-origin: center center;
    }

    @keyframes ringOrbit {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes ringAura {
      0% {
        transform: scale(0.96);
        opacity: 0.7;
        filter: drop-shadow(0 0 10px rgba(132, 204, 22, 0.7));
      }
      100% {
        transform: scale(1.05);
        opacity: 1;
        filter: drop-shadow(0 0 25px rgba(163, 230, 53, 0.95));
      }
    }

    /* 3D Master Badge Icon */
    .app-icon-img {
      width: 130px;
      height: 130px;
      object-fit: contain;
      border-radius: 34px;
      filter: drop-shadow(0 22px 45px rgba(0, 0, 0, 0.75));
      transform-style: preserve-3d;
      z-index: 2;
    }

    /* Brand Typography */
    .brand-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transform-style: preserve-3d;
      animation: zoomInText 1.5s cubic-bezier(0.15, 0.85, 0.35, 1) 0.2s forwards;
      opacity: 0;
    }

    @keyframes zoomInText {
      0% {
        transform: translateZ(-600px) translateY(35px);
        opacity: 0;
      }
      100% {
        transform: translateZ(0px) translateY(0px);
        opacity: 1;
      }
    }

    .brand-name {
      font-size: 34px;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: -0.03em;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .brand-name span.lime {
      color: #84CC16;
      text-shadow: 0 0 25px rgba(132, 204, 22, 0.75);
    }

    .owner-badge {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      background: rgba(132, 204, 22, 0.2);
      color: #A3E635;
      border: 1px solid rgba(132, 204, 22, 0.45);
      padding: 3px 8px;
      border-radius: 9999px;
    }

    .brand-sub {
      font-size: 11px;
      font-weight: 700;
      color: #94A3B8;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    /* Sleek Loading Bar */
    .progress-track {
      width: 160px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #059669 0%, #84CC16 100%);
      box-shadow: 0 0 12px rgba(132, 204, 22, 0.9);
      border-radius: 9999px;
      animation: fillBar 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fillBar {
      0% { width: 10%; }
      70% { width: 85%; }
      100% { width: 100%; }
    }
  </style>

<body>

  <!-- Tektone-inspired 3D Perspective Loading Scene -->
  <div id="citasya-loader">
    <div class="space-3d">
      <div class="ambient-glow"></div>
      <div class="particle p1"></div>
      <div class="particle p2"></div>
      <div class="particle p3"></div>
      <div class="particle p4"></div>

      <div class="logo-3d-box">
        <!-- Neon Pulsing Enveloping SVG Ring -->
        <svg class="svg-ring" viewBox="0 0 174 174">
          <defs>
            <linearGradient id="limeGradOwner" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#A3E635" />
              <stop offset="50%" stop-color="#84CC16" />
              <stop offset="100%" stop-color="#059669" />
            </linearGradient>
          </defs>
          <rect class="ring-track" x="12" y="12" width="150" height="150" rx="38" ry="38" />
          <rect class="ring-pulse-stroke" x="12" y="12" width="150" height="150" rx="38" ry="38" />
        </svg>

        <!-- 3D Master Logo Badge -->
        <img src="loading_logo.png?v=20260925" alt="CitasYa Negocios" class="app-icon-img" id="app-icon">
      </div>

      <div class="brand-content">
        <div class="brand-name">
          <span>Citas<span class="lime">Ya</span></span>
          <span class="owner-badge">PRO</span>
        </div>
        <div class="brand-sub">Panel de Negocios · Bolivia</div>

        <div class="progress-track">
          <div class="progress-fill" id="progress-bar"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Synchronized Temple Scene Zoom-Out Exit Hook -->
  <script>
    (function() {
      let isReady = false;
      let animationFinished = false;
      const loader = document.getElementById('citasya-loader');

      function tryDismiss() {
        if (isReady && animationFinished && loader) {
          loader.classList.add('fade-out');
          setTimeout(function() {
            loader.remove();
          }, 600);
        }
      }

      setTimeout(function() {
        animationFinished = true;
        tryDismiss();
      }, 1700);

      window.addEventListener('citasya-app-fully-loaded', function() {
        isReady = true;
        tryDismiss();
      });

      window.addEventListener('flutter-first-frame', function() {
        isReady = true;
        tryDismiss();
      });

      setTimeout(function() {
        isReady = true;
        animationFinished = true;
        tryDismiss();
      }, 4500);
    })();
  </script>

  <!-- Unregister any stale service workers and bypass registration to eliminate 4s boot latency -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
      // Override register to instantly resolve 0ms instead of 4000ms timeout
      navigator.serviceWorker.register = function() {
        return Promise.resolve({
          active: null,
          installing: null,
          waiting: null,
          update: function() { return Promise.resolve(this); }
        });
      };
    }
  </script>

  <!-- Flutter Web Bootstrap -->
  <script src="flutter_bootstrap.js?v=20260924v14" async></script>
</body>
